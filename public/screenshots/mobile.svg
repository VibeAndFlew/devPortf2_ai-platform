<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a1a"/>
      <stop offset="100%" stop-color="#140a28"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glass">
      <feFlood flood-color="rgba(26,18,40,0.8)" result="color"/>
      <feComposite in="color" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="blurBg">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Phone frame -->
  <rect x="20" y="20" width="360" height="710" rx="40" fill="#0a0712" stroke="rgba(124,58,237,0.2)" stroke-width="2"/>
  <rect x="140" y="30" width="120" height="24" rx="12" fill="#0a0712" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>

  <!-- Screen -->
  <rect x="28" y="56" width="344" height="666" rx="30" fill="url(#bg)"/>

  <!-- Status bar -->
  <text x="50" y="80" font-family="sans-serif" font-size="11" fill="#9a8ab0">9:41</text>
  <rect x="280" y="72" width="16" height="10" rx="2" fill="none" stroke="#9a8ab0" stroke-width="1"/>
  <rect x="302" y="72" width="10" height="10" rx="2" fill="none" stroke="#9a8ab0" stroke-width="1"/>
  <rect x="318" y="72" width="14" height="10" rx="2" fill="none" stroke="#9a8ab0" stroke-width="1"/>
  <circle cx="342" cy="77" r="4" fill="#22c55e"/>

  <!-- Header -->
  <rect x="28" y="86" width="344" height="56" rx="0" fill="rgba(15,10,26,0.95)"/>
  <rect x="44" y="100" width="24" height="24" rx="6" fill="url(#accent)"/>
  <text x="50" y="115" font-family="monospace" font-size="10" fill="#fff" font-weight="bold">N</text>
  <text x="74" y="115" font-family="sans-serif" font-size="12" fill="#e8e0f0" font-weight="700">NOVA AI</text>
  <circle cx="344" cy="112" r="12" fill="#2d1b4e" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>

  <!-- Tab bar -->
  <rect x="28" y="142" width="344" height="40" fill="rgba(15,10,26,0.95)"/>
  <rect x="44" y="152" width="60" height="20" rx="6" fill="rgba(124,58,237,0.2)"/>
  <text x="50" y="165" font-family="sans-serif" font-size="10" fill="#a78bfa">Dashboard</text>
  <text x="120" y="165" font-family="sans-serif" font-size="10" fill="#9a8ab0">Chat</text>
  <text x="160" y="165" font-family="sans-serif" font-size="10" fill="#9a8ab0">Agents</text>
  <text x="210" y="165" font-family="sans-serif" font-size="10" fill="#9a8ab0">More</text>

  <!-- Content -->
  <text x="44" y="200" font-family="sans-serif" font-size="16" fill="#e8e0f0" font-weight="700">Welcome back</text>
  <text x="44" y="218" font-family="sans-serif" font-size="10" fill="#9a8ab0">2 active workflows • 3 new messages</text>

  <!-- Cards -->
  <rect x="36" y="235" width="328" height="80" rx="10" fill="rgba(26,18,40,0.6)" stroke="rgba(124,58,237,0.12)" stroke-width="1"/>
  <rect x="50" y="250" width="48" height="48" rx="10" fill="rgba(124,58,237,0.15)"/>
  <text x="54" y="278" font-family="serif" font-size="20" fill="#a78bfa">⚡</text>
  <text x="112" y="268" font-family="sans-serif" font-size="12" fill="#e8e0f0" font-weight="600">Workflow "Data Pipeline"</text>
  <text x="112" y="286" font-family="sans-serif" font-size="10" fill="#9a8ab0">Running • ETA 2 min</text>
  <circle cx="336" cy="270" r="4" fill="#22c55e"/>

  <rect x="36" y="325" width="328" height="80" rx="10" fill="rgba(26,18,40,0.6)" stroke="rgba(124,58,237,0.12)" stroke-width="1"/>
  <rect x="50" y="340" width="48" height="48" rx="10" fill="rgba(59,130,246,0.15)"/>
  <text x="56" y="368" font-family="serif" font-size="20" fill="#60a5fa">💬</text>
  <text x="112" y="358" font-family="sans-serif" font-size="12" fill="#e8e0f0" font-weight="600">Chat with GPT-4o</text>
  <text x="112" y="376" font-family="sans-serif" font-size="10" fill="#9a8ab0">New response ready</text>
  <circle cx="336" cy="360" r="4" fill="#3b82f6"/>

  <rect x="36" y="415" width="328" height="80" rx="10" fill="rgba(26,18,40,0.6)" stroke="rgba(124,58,237,0.12)" stroke-width="1"/>
  <rect x="50" y="430" width="48" height="48" rx="10" fill="rgba(34,197,94,0.15)"/>
  <text x="58" y="458" font-family="serif" font-size="20" fill="#4ade80">📄</text>
  <text x="112" y="448" font-family="sans-serif" font-size="12" fill="#e8e0f0" font-weight="600">Knowledge Sync Complete</text>
  <text x="112" y="466" font-family="sans-serif" font-size="10" fill="#9a8ab0">142 new documents indexed</text>
  <circle cx="336" cy="450" r="4" fill="#22c55e"/>

  <!-- Quick stats row -->
  <text x="44" y="530" font-family="sans-serif" font-size="14" fill="#e8e0f0" font-weight="600">Quick Stats</text>
  <rect x="36" y="542" width="156" height="60" rx="8" fill="rgba(26,18,40,0.6)" stroke="rgba(124,58,237,0.12)" stroke-width="1"/>
  <text x="50" y="562" font-family="sans-serif" font-size="10" fill="#9a8ab0">Active Agents</text>
  <text x="50" y="584" font-family="sans-serif" font-size="18" fill="#e8e0f0" font-weight="700">12</text>
  <text x="96" y="584" font-family="sans-serif" font-size="9" fill="#22c55e">+3</text>

  <rect x="204" y="542" width="160" height="60" rx="8" fill="rgba(26,18,40,0.6)" stroke="rgba(124,58,237,0.12)" stroke-width="1"/>
  <text x="218" y="562" font-family="sans-serif" font-size="10" fill="#9a8ab0">Token Usage</text>
  <text x="218" y="584" font-family="sans-serif" font-size="18" fill="#e8e0f0" font-weight="700">142K</text>
  <text x="276" y="584" font-family="sans-serif" font-size="9" fill="#22c55e">-8%</text>

  <!-- Bottom navigation -->
  <rect x="28" y="620" width="344" height="50" fill="rgba(15,10,26,0.95)"/>
  <rect x="44" y="630" width="40" height="30" rx="6" fill="rgba(124,58,237,0.15)"/>
  <rect x="120" y="630" width="40" height="30" rx="6" fill="rgba(26,18,40,0.8)"/>
  <rect x="196" y="630" width="40" height="30" rx="6" fill="rgba(26,18,40,0.8)"/>
  <rect x="272" y="630" width="40" height="30" rx="6" fill="rgba(26,18,40,0.8)"/>

  <!-- Home indicator -->
  <rect x="120" y="688" width="160" height="4" rx="2" fill="rgba(232,224,240,0.2)"/>
</svg>
