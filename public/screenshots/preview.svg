<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a1a"/>
      <stop offset="100%" stop-color="#140a28"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glass">
      <feFlood flood-color="rgba(26,18,40,0.6)" result="color"/>
      <feComposite in="color" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blurBg">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="300" cy="650" r="250" fill="#7c3aed" opacity="0.04" filter="url(#blurBg)"/>
  <circle cx="1000" cy="100" r="200" fill="#8b5cf6" opacity="0.03" filter="url(#blurBg)"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="1200" height="56" fill="rgba(15,10,26,0.95)" stroke="rgba(124,58,237,0.1)" stroke-width="1"/>
  <rect x="20" y="14" width="28" height="28" rx="8" fill="url(#accent)"/>
  <text x="28" y="32" font-family="monospace" font-size="12" fill="#fff" font-weight="bold">N</text>
  <text x="56" y="32" font-family="sans-serif" font-size="14" fill="#e8e0f0" font-weight="700">NOVA AI</text>

  <!-- Tab navigation -->
  <rect x="260" y="14" width="70" height="28" rx="6" fill="rgba(124,58,237,0.08)"/>
  <text x="272" y="32" font-family="sans-serif" font-size="12" fill="#9a8ab0">Chat</text>
  <rect x="340" y="14" width="80" height="28" rx="6" fill="rgba(124,58,237,0.08)"/>
  <text x="350" y="32" font-family="sans-serif" font-size="12" fill="#9a8ab0">Workflows</text>
  <rect x="430" y="14" width="70" height="28" rx="6" fill="rgba(124,58,237,0.08)"/>
  <text x="442" y="32" font-family="sans-serif" font-size="12" fill="#9a8ab0">Agents</text>
  <rect x="510" y="14" width="80" height="28" rx="6" fill="rgba(124,58,237,0.08)"/>
  <text x="522" y="32" font-family="sans-serif" font-size="12" fill="#9a8ab0">Knowledge</text>
  <rect x="600" y="14" width="70" height="28" rx="6" fill="rgba(124,58,237,0.08)"/>
  <text x="612" y="32" font-family="sans-serif" font-size="12" fill="#9a8ab0">Prompts</text>
  <rect x="680" y="14" width="90" height="28" rx="6" fill="rgba(124,58,237,0.2)"/>
  <text x="693" y="32" font-family="sans-serif" font-size="12" fill="#fff" font-weight="600">Playground</text>
  <rect x="780" y="14" width="90" height="28" rx="6" fill="rgba(124,58,237,0.08)"/>
  <text x="795" y="32" font-family="sans-serif" font-size="12" fill="#9a8ab0">Vector Search</text>

  <circle cx="1150" cy="28" r="12" fill="#2d1b4e" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>

  <!-- Main layout: Left panel (Input), Right panel (Output) -->
  <!-- Left panel -->
  <rect x="20" y="76" width="560" height="650" rx="14" fill="rgba(26,18,40,0.6)" stroke="rgba(124,58,237,0.12)" stroke-width="1"/>

  <text x="40" y="106" font-family="sans-serif" font-size="17" fill="#e8e0f0" font-weight="600">Model Playground</text>
  <text x="40" y="126" font-family="sans-serif" font-size="12" fill="#9a8ab0">Test and compare model responses in real time.</text>

  <!-- Model selector -->
  <rect x="40" y="144" width="520" height="44" rx="8" fill="rgba(15,10,26,0.6)" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
  <text x="56" y="170" font-family="sans-serif" font-size="13" fill="#e8e0f0">Model</text>
  <rect x="280" y="152" width="260" height="28" rx="6" fill="rgba(124,58,237,0.1)"/>
  <text x="296" y="170" font-family="sans-serif" font-size="12" fill="#a78bfa">gpt-4o-2024-11-20</text>

  <!-- Parameters -->
  <text x="40" y="212" font-family="sans-serif" font-size="14" fill="#e8e0f0" font-weight="600">Parameters</text>

  <rect x="40" y="226" width="250" height="56" rx="8" fill="rgba(15,10,26,0.4)" stroke="rgba(124,58,237,0.08)" stroke-width="1"/>
  <text x="56" y="248" font-family="sans-serif" font-size="11" fill="#9a8ab0">Temperature</text>
  <text x="240" y="248" font-family="sans-serif" font-size="11" fill="#e8e0f0">0.7</text>
  <rect x="56" y="256" width="220" height="4" rx="2" fill="rgba(124,58,237,0.15)"/>
  <rect x="56" y="256" width="160" height="4" rx="2" fill="url(#accent)"/>

  <rect x="310" y="226" width="250" height="56" rx="8" fill="rgba(15,10,26,0.4)" stroke="rgba(124,58,237,0.08)" stroke-width="1"/>
  <text x="326" y="248" font-family="sans-serif" font-size="11" fill="#9a8ab0">Max Tokens</text>
  <text x="510" y="248" font-family="sans-serif" font-size="11" fill="#e8e0f0">2048</text>
  <rect x="326" y="256" width="220" height="4" rx="2" fill="rgba(124,58,237,0.15)"/>
  <rect x="326" y="256" width="140" height="4" rx="2" fill="url(#accent)"/>

  <rect x="40" y="294" width="250" height="56" rx="8" fill="rgba(15,10,26,0.4)" stroke="rgba(124,58,237,0.08)" stroke-width="1"/>
  <text x="56" y="316" font-family="sans-serif" font-size="11" fill="#9a8ab0">Top P</text>
  <text x="240" y="316" font-family="sans-serif" font-size="11" fill="#e8e0f0">0.95</text>
  <rect x="56" y="324" width="220" height="4" rx="2" fill="rgba(124,58,237,0.15)"/>
  <rect x="56" y="324" width="200" height="4" rx="2" fill="url(#accent)"/>

  <rect x="310" y="294" width="250" height="56" rx="8" fill="rgba(15,10,26,0.4)" stroke="rgba(124,58,237,0.08)" stroke-width="1"/>
  <text x="326" y="316" font-family="sans-serif" font-size="11" fill="#9a8ab0">Frequency Penalty</text>
  <text x="510" y="316" font-family="sans-serif" font-size="11" fill="#e8e0f0">0.0</text>
  <rect x="326" y="324" width="220" height="4" rx="2" fill="rgba(124,58,237,0.15)"/>
  <rect x="326" y="324" width="40" height="4" rx="2" fill="url(#accent)"/>

  <!-- System prompt -->
  <text x="40" y="380" font-family="sans-serif" font-size="14" fill="#e8e0f0" font-weight="600">System Prompt</text>
  <rect x="40" y="392" width="520" height="68" rx="8" fill="rgba(15,10,26,0.4)" stroke="rgba(124,58,237,0.08)" stroke-width="1"/>
  <text x="56" y="412" font-family="sans-serif" font-size="11" fill="#9a8ab0">You are an expert AI assistant with deep knowledge of</text>
  <text x="56" y="428" font-family="sans-serif" font-size="11" fill="#9a8ab0">software engineering, system design, and best practices.</text>
  <text x="56" y="444" font-family="sans-serif" font-size="11" fill="#9a8ab0">Provide clear, concise, and actionable responses.</text>

  <!-- User input -->
  <text x="40" y="488" font-family="sans-serif" font-size="14" fill="#e8e0f0" font-weight="600">User Message</text>
  <rect x="40" y="502" width="520" height="100" rx="8" fill="rgba(15,10,26,0.4)" stroke="rgba(124,58,237,0.08)" stroke-width="1"/>
  <text x="56" y="524" font-family="sans-serif" font-size="11" fill="#9a8ab0">Design a fault-tolerant microservices architecture for</text>
  <text x="56" y="540" font-family="sans-serif" font-size="11" fill="#9a8ab0">a real-time AI-powered data pipeline that processes</text>
  <text x="56" y="556" font-family="sans-serif" font-size="11" fill="#9a8ab0">streaming data from multiple sources with exactly-once</text>
  <text x="56" y="572" font-family="sans-serif" font-size="11" fill="#9a8ab0">processing semantics and sub-100ms latency.</text>

  <!-- Action buttons -->
  <rect x="40" y="616" width="520" height="44" rx="10" fill="url(#accent)"/>
  <text x="260" y="642" font-family="sans-serif" font-size="14" fill="#fff" font-weight="600" text-anchor="middle">Send Request</text>

  <rect x="40" y="672" width="250" height="36" rx="8" fill="rgba(124,58,237,0.08)"/>
  <text x="100" y="694" font-family="sans-serif" font-size="12" fill="#a78bfa">Clear All</text>
  <rect x="310" y="672" width="250" height="36" rx="8" fill="rgba(124,58,237,0.08)"/>
  <text x="380" y="694" font-family="sans-serif" font-size="12" fill="#a78bfa">Save as Preset</text>

  <!-- Right panel -->
  <rect x="600" y="76" width="580" height="650" rx="14" fill="rgba(26,18,40,0.6)" stroke="rgba(124,58,237,0.12)" stroke-width="1"/>

  <text x="620" y="106" font-family="sans-serif" font-size="17" fill="#e8e0f0" font-weight="600">Response</text>

  <!-- Tabs -->
  <rect x="620" y="120" width="80" height="28" rx="6" fill="rgba(124,58,237,0.2)"/>
  <text x="632" y="138" font-family="sans-serif" font-size="11" fill="#fff">Preview</text>
  <rect x="708" y="120" width="80" height="28" rx="6" fill="rgba(124,58,237,0.05)"/>
  <text x="720" y="138" font-family="sans-serif" font-size="11" fill="#9a8ab0">Raw JSON</text>
  <rect x="796" y="120" width="80" height="28" rx="6" fill="rgba(124,58,237,0.05)"/>
  <text x="808" y="138" font-family="sans-serif" font-size="11" fill="#9a8ab0">Stats</text>

  <!-- Response content -->
  <rect x="620" y="160" width="540" height="320" rx="10" fill="rgba(15,10,26,0.5)" stroke="rgba(124,58,237,0.08)" stroke-width="1"/>

  <text x="640" y="186" font-family="sans-serif" font-size="12" fill="#e8e0f0" font-weight="600">Architecture Design: Fault-Tolerant Microservices</text>

  <text x="640" y="210" font-family="sans-serif" font-size="11" fill="#e8e0f0">Here's a comprehensive architecture design:</text>

  <rect x="640" y="225" width="500" height="22" rx="4" fill="rgba(124,58,237,0.08)"/>
  <text x="656" y="240" font-family="sans-serif" font-size="11" fill="#a78bfa">1. Data Ingestion Layer</text>

  <text x="656" y="260" font-family="sans-serif" font-size="11" fill="#e8e0f0">• Apache Kafka as the message backbone with 3x replication</text>
  <text x="656" y="278" font-family="sans-serif" font-size="11" fill="#e8e0f0">• Idempotent producers with exactly-once semantics</text>
  <text x="656" y="296" font-family="sans-serif" font-size="11" fill="#e8e0f0">• Schema Registry for Avro serialization</text>

  <rect x="640" y="312" width="500" height="22" rx="4" fill="rgba(124,58,237,0.08)"/>
  <text x="656" y="327" font-family="sans-serif" font-size="11" fill="#a78bfa">2. Processing Layer</text>

  <text x="656" y="347" font-family="sans-serif" font-size="11" fill="#e8e0f0">• Stateful stream processing with Flink</text>
  <text x="656" y="365" font-family="sans-serif" font-size="11" fill="#e8e0f0">• Circuit breaker pattern with Resilience4j</text>
  <text x="656" y="383" font-family="sans-serif" font-size="11" fill="#e8e0f0">• Distributed rate limiting via Redis</text>

  <rect x="640" y="399" width="500" height="22" rx="4" fill="rgba(124,58,237,0.08)"/>
  <text x="656" y="414" font-family="sans-serif" font-size="11" fill="#a78bfa">3. Storage &amp; Serving</text>

  <text x="656" y="434" font-family="sans-serif" font-size="11" fill="#e8e0f0">• Time-series data in ClickHouse for analytics</text>
  <text x="656" y="452" font-family="sans-serif" font-size="11" fill="#e8e0f0">• CQRS pattern for read/write separation</text>
  <text x="656" y="470" font-family="sans-serif" font-size="11" fill="#e8e0f0">• Materialized views for real-time aggregations</text>

  <!-- Tokens / Usage -->
  <rect x="620" y="496" width="540" height="60" rx="10" fill="rgba(15,10,26,0.4)" stroke="rgba(124,58,237,0.08)" stroke-width="1"/>
  <text x="640" y="518" font-family="sans-serif" font-size="11" fill="#9a8ab0">Input Tokens</text>
  <text x="720" y="518" font-family="sans-serif" font-size="11" fill="#e8e0f0">142</text>
  <text x="780" y="518" font-family="sans-serif" font-size="11" fill="#9a8ab0">Output Tokens</text>
  <text x="868" y="518" font-family="sans-serif" font-size="11" fill="#e8e0f0">384</text>
  <text x="940" y="518" font-family="sans-serif" font-size="11" fill="#9a8ab0">Total Cost</text>
  <text x="1008" y="518" font-family="sans-serif" font-size="11" fill="#e8e0f0">$0.0028</text>
  <text x="640" y="540" font-family="sans-serif" font-size="10" fill="#22c55e">Latency: 1.2s • Model: gpt-4o-2024-11-20</text>

  <!-- Actions -->
  <rect x="620" y="572" width="540" height="44" rx="10" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
  <text x="640" y="598" font-family="sans-serif" font-size="12" fill="#22c55e">Response generated in 1.2s</text>

  <rect x="620" y="628" width="170" height="36" rx="8" fill="rgba(124,58,237,0.08)"/>
  <text x="665" y="650" font-family="sans-serif" font-size="12" fill="#a78bfa">Copy Response</text>
  <rect x="800" y="628" width="170" height="36" rx="8" fill="rgba(124,58,237,0.08)"/>
  <text x="850" y="650" font-family="sans-serif" font-size="12" fill="#a78bfa">Share</text>
  <rect x="980" y="628" width="170" height="36" rx="8" fill="rgba(124,58,237,0.08)"/>
  <text x="1030" y="650" font-family="sans-serif" font-size="12" fill="#a78bfa">New Test</text>

  <!-- Comparison hint -->
  <rect x="620" y="680" width="540" height="30" rx="8" fill="rgba(245,158,11,0.06)"/>
  <text x="680" y="700" font-family="sans-serif" font-size="11" fill="#f59e0b">Run with different parameters to compare responses</text>
</svg>
