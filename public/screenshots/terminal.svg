<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0712"/>
      <stop offset="100%" stop-color="#0f0a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blurBg">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="700" cy="100" r="150" fill="#7c3aed" opacity="0.04" filter="url(#blurBg)"/>

  <!-- Terminal window -->
  <rect x="30" y="30" width="740" height="440" rx="12" fill="rgba(15,8,28,0.95)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="30" y="30" width="740" height="36" rx="12" fill="rgba(26,18,40,0.9)" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
  <rect x="30" y="42" width="740" height="24" fill="rgba(26,18,40,0.9)"/>
  <!-- Window dots -->
  <circle cx="56" cy="48" r="5" fill="#dc2626"/>
  <circle cx="74" cy="48" r="5" fill="#f59e0b"/>
  <circle cx="92" cy="48" r="5" fill="#22c55e"/>

  <!-- Title -->
  <rect x="300" y="38" width="160" height="20" rx="4" fill="rgba(124,58,237,0.1)"/>
  <text x="330" y="52" font-family="sans-serif" font-size="11" fill="#9a8ab0">nova-ai-cli@v1.0</text>

  <!-- Terminal content -->
  <text x="50" y="90" font-family="monospace" font-size="12" fill="#9a8ab0">$ </text>
  <text x="65" y="90" font-family="monospace" font-size="12" fill="#22c55e">nova</text>
  <text x="100" y="90" font-family="monospace" font-size="12" fill="#e8e0f0"> --help</text>

  <text x="50" y="112" font-family="monospace" font-size="12" fill="#a78bfa">NOVA AI Workflow OS v1.0.0</text>
  <text x="50" y="130" font-family="monospace" font-size="12" fill="#9a8ab0">Usage: nova &lt;command&gt; [options]</text>
  <text x="50" y="148" font-family="monospace" font-size="12" fill="#9a8ab0"/>
  <text x="50" y="166" font-family="monospace" font-size="12" fill="#9a8ab0">Commands:</text>
  <text x="70" y="184" font-family="monospace" font-size="12" fill="#22c55e">  chat</text>
  <text x="170" y="184" font-family="monospace" font-size="12" fill="#9a8ab0">Start an AI conversation</text>
  <text x="70" y="202" font-family="monospace" font-size="12" fill="#22c55e">  workflow</text>
  <text x="170" y="202" font-family="monospace" font-size="12" fill="#9a8ab0">Manage and run workflows</text>
  <text x="70" y="220" font-family="monospace" font-size="12" fill="#22c55e">  agent</text>
  <text x="170" y="220" font-family="monospace" font-size="12" fill="#9a8ab0">Configure AI agents</text>
  <text x="70" y="238" font-family="monospace" font-size="12" fill="#22c55e">  knowledge</text>
  <text x="170" y="238" font-family="monospace" font-size="12" fill="#9a8ab0">Index and search knowledge</text>
  <text x="70" y="256" font-family="monospace" font-size="12" fill="#22c55e">  prompt</text>
  <text x="170" y="256" font-family="monospace" font-size="12" fill="#9a8ab0">Manage prompt templates</text>
  <text x="70" y="274" font-family="monospace" font-size="12" fill="#22c55e">  vector</text>
  <text x="170" y="274" font-family="monospace" font-size="12" fill="#9a8ab0">Vector similarity search</text>
  <text x="70" y="292" font-family="monospace" font-size="12" fill="#22c55e">  monitor</text>
  <text x="170" y="292" font-family="monospace" font-size="12" fill="#9a8ab0">System monitoring</text>

  <text x="50" y="314" font-family="monospace" font-size="12" fill="#9a8ab0"/>
  <text x="50" y="332" font-family="monospace" font-size="12" fill="#9a8ab0">$ </text>
  <text x="65" y="332" font-family="monospace" font-size="12" fill="#22c55e">nova</text>
  <text x="100" y="332" font-family="monospace" font-size="12" fill="#e8e0f0"> chat "explain quantum computing" --model gpt-4o --stream</text>

  <!-- Simulated response -->
  <rect x="50" y="348" width="700" height="90" rx="6" fill="rgba(124,58,237,0.05)"/>
  <text x="65" y="367" font-family="monospace" font-size="11" fill="#a78bfa">┌─ Response ──────────────────────────────────────────┐</text>
  <text x="65" y="385" font-family="monospace" font-size="11" fill="#e8e0f0">│ Quantum computing uses qubits instead of classical   │</text>
  <text x="65" y="403" font-family="monospace" font-size="11" fill="#e8e0f0">│ bits, leveraging superposition and entanglement to   │</text>
  <text x="65" y="421" font-family="monospace" font-size="11" fill="#e8e0f0">│ perform certain computations exponentially faster...  │</text>
  <text x="65" y="439" font-family="monospace" font-size="11" fill="#a78bfa">└──────────────────────────────────────────────────────┘</text>

  <!-- Status bar -->
  <rect x="50" y="450" width="700" height="16" rx="4" fill="rgba(124,58,237,0.06)"/>
  <circle cx="65" cy="458" r="3" fill="#22c55e"/>
  <text x="72" y="462" font-family="monospace" font-size="9" fill="#22c55e">connected</text>
  <text x="160" y="462" font-family="monospace" font-size="9" fill="#9a8ab0">model: gpt-4o</text>
  <text x="280" y="462" font-family="monospace" font-size="9" fill="#9a8ab0">tokens: 142/4096</text>
  <text x="430" y="462" font-family="monospace" font-size="9" fill="#9a8ab0">latency: 45ms</text>
  <text x="600" y="462" font-family="monospace" font-size="9" fill="#9a8ab0">cost: $0.0023</text>
</svg>
