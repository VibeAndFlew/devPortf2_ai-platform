<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a1a"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glass">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0" result="blur"/>
      <feFlood flood-color="rgba(26,18,40,0.6)" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glass"/>
      <feBlend in="glass" in2="SourceGraphic"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blurBg">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bg)"/>

  <!-- Decorative blurs -->
  <circle cx="100" cy="100" r="200" fill="#7c3aed" opacity="0.08" filter="url(#blurBg)"/>
  <circle cx="1100" cy="600" r="250" fill="#8b5cf6" opacity="0.06" filter="url(#blurBg)"/>
  <circle cx="600" cy="400" r="300" fill="#6d28d9" opacity="0.04" filter="url(#blurBg)"/>

  <!-- Top Navigation Bar -->
  <rect x="20" y="20" width="1160" height="56" rx="12" fill="rgba(26,18,40,0.7)" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
  <!-- Logo -->
  <rect x="36" y="34" width="28" height="28" rx="8" fill="url(#accent)"/>
  <text x="44" y="52" font-family="monospace" font-size="12" fill="#fff" font-weight="bold">N</text>
  <text x="74" y="52" font-family="sans-serif" font-size="14" fill="#e8e0f0" font-weight="700">NOVA AI</text>
  <!-- Nav items -->
  <rect x="300" y="36" width="60" height="24" rx="6" fill="rgba(124,58,237,0.2)"/>
  <text x="315" y="52" font-family="sans-serif" font-size="12" fill="#a78bfa">Dashboard</text>
  <text x="380" y="52" font-family="sans-serif" font-size="12" fill="#9a8ab0">Chat</text>
  <text x="430" y="52" font-family="sans-serif" font-size="12" fill="#9a8ab0">Workflows</text>
  <text x="485" y="52" font-family="sans-serif" font-size="12" fill="#9a8ab0">Agents</text>
  <text x="535" y="52" font-family="sans-serif" font-size="12" fill="#9a8ab0">Knowledge</text>
  <!-- Right side -->
  <rect x="1050" y="34" width="100" height="28" rx="8" fill="url(#accent)" opacity="0.9"/>
  <text x="1070" y="52" font-family="sans-serif" font-size="12" fill="#fff" font-weight="500">+ New Agent</text>
  <circle cx="1105" cy="48" r="12" fill="#2d1b4e" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>

  <!-- Welcome Header -->
  <text x="36" y="110" font-family="sans-serif" font-size="24" fill="#e8e0f0" font-weight="700">Welcome back, Nova</text>
  <text x="36" y="132" font-family="sans-serif" font-size="13" fill="#9a8ab0">Here's what's happening with your AI workspace today.</text>

  <!-- Stats Row -->
  <rect x="20" y="150" width="270" height="100" rx="12" fill="rgba(26,18,40,0.6)" stroke="rgba(124,58,237,0.12)" stroke-width="1"/>
  <text x="40" y="180" font-family="sans-serif" font-size="13" fill="#9a8ab0">Active Agents</text>
  <text x="40" y="215" font-family="sans-serif" font-size="28" fill="#e8e0f0" font-weight="700">12</text>
  <text x="90" y="215" font-family="sans-serif" font-size="12" fill="#22c55e">+3 today</text>
  <circle cx="260" cy="175" r="30" fill="#7c3aed" opacity="0.1"/>
  <circle cx="260" cy="175" r="15" fill="#7c3aed" opacity="0.2"/>

  <rect x="310" y="150" width="270" height="100" rx="12" fill="rgba(26,18,40,0.6)" stroke="rgba(124,58,237,0.12)" stroke-width="1"/>
  <text x="330" y="180" font-family="sans-serif" font-size="13" fill="#9a8ab0">Workflows Running</text>
  <text x="330" y="215" font-family="sans-serif" font-size="28" fill="#e8e0f0" font-weight="700">8</text>
  <text x="380" y="215" font-family="sans-serif" font-size="12" fill="#f59e0b">2 queued</text>

  <rect x="600" y="150" width="270" height="100" rx="12" fill="rgba(26,18,40,0.6)" stroke="rgba(124,58,237,0.12)" stroke-width="1"/>
  <text x="620" y="180" font-family="sans-serif" font-size="13" fill="#9a8ab0">Total Queries</text>
  <text x="620" y="215" font-family="sans-serif" font-size="28" fill="#e8e0f0" font-weight="700">2,847</text>
  <text x="680" y="215" font-family="sans-serif" font-size="12" fill="#22c55e">+12.5%</text>

  <rect x="890" y="150" width="290" height="100" rx="12" fill="rgba(26,18,40,0.6)" stroke="rgba(124,58,237,0.12)" stroke-width="1"/>
  <text x="910" y="180" font-family="sans-serif" font-size="13" fill="#9a8ab0">Token Usage (today)</text>
  <text x="910" y="215" font-family="sans-serif" font-size="28" fill="#e8e0f0" font-weight="700">142K</text>
  <text x="975" y="215" font-family="sans-serif" font-size="12" fill="#22c55e">under limit</text>

  <!-- Activity Chart -->
  <rect x="20" y="270" width="780" height="300" rx="12" fill="rgba(26,18,40,0.6)" stroke="rgba(124,58,237,0.12)" stroke-width="1"/>
  <text x="40" y="300" font-family="sans-serif" font-size="16" fill="#e8e0f0" font-weight="600">Activity Overview</text>
  <text x="40" y="318" font-family="sans-serif" font-size="12" fill="#9a8ab0">Last 7 days</text>

  <!-- Chart area -->
  <rect x="40" y="335" width="740" height="210" rx="8" fill="rgba(124,58,237,0.03)" stroke="rgba(124,58,237,0.06)" stroke-width="1"/>
  <!-- Grid lines -->
  <line x1="60" y1="375" x2="760" y2="375" stroke="rgba(124,58,237,0.1)"/>
  <line x1="60" y1="415" x2="760" y2="415" stroke="rgba(124,58,237,0.1)"/>
  <line x1="60" y1="455" x2="760" y2="455" stroke="rgba(124,58,237,0.1)"/>
  <line x1="60" y1="495" x2="760" y2="495" stroke="rgba(124,58,237,0.1)"/>
  <line x1="60" y1="535" x2="760" y2="535" stroke="rgba(124,58,237,0.1)"/>
  <!-- Data line -->
  <polyline points="100,510 200,480 300,490 400,440 500,410 600,380 700,350" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Gradient fill under line -->
  <path d="M100,510 L100,510 L200,480 L300,490 L400,440 L500,410 L600,380 L700,350 L700,535 L100,535 Z" fill="url(#accent)" opacity="0.08"/>
  <!-- Data points -->
  <circle cx="400" cy="440" r="4" fill="#7c3aed"/>
  <circle cx="500" cy="410" r="4" fill="#7c3aed"/>
  <circle cx="600" cy="380" r="4" fill="#7c3aed"/>
  <circle cx="700" cy="350" r="4" fill="#7c3aed" filter="url(#glow)"/>
  <!-- X-axis labels -->
  <text x="100" y="558" font-family="sans-serif" font-size="11" fill="#9a8ab0">Mon</text>
  <text x="200" y="558" font-family="sans-serif" font-size="11" fill="#9a8ab0">Tue</text>
  <text x="300" y="558" font-family="sans-serif" font-size="11" fill="#9a8ab0">Wed</text>
  <text x="400" y="558" font-family="sans-serif" font-size="11" fill="#9a8ab0">Thu</text>
  <text x="500" y="558" font-family="sans-serif" font-size="11" fill="#9a8ab0">Fri</text>
  <text x="600" y="558" font-family="sans-serif" font-size="11" fill="#9a8ab0">Sat</text>
  <text x="700" y="558" font-family="sans-serif" font-size="11" fill="#9a8ab0">Sun</text>

  <!-- Right sidebar -->
  <rect x="820" y="270" width="360" height="300" rx="12" fill="rgba(26,18,40,0.6)" stroke="rgba(124,58,237,0.12)" stroke-width="1"/>
  <text x="840" y="300" font-family="sans-serif" font-size="16" fill="#e8e0f0" font-weight="600">Recent Activity</text>

  <!-- Activity items -->
  <rect x="840" y="320" width="320" height="40" rx="8" fill="rgba(124,58,237,0.05)"/>
  <circle cx="858" cy="340" r="6" fill="#22c55e"/>
  <text x="874" y="338" font-family="sans-serif" font-size="12" fill="#e8e0f0">Workflow "Data Pipeline" completed</text>
  <text x="874" y="352" font-family="sans-serif" font-size="10" fill="#9a8ab0">2 min ago</text>

  <rect x="840" y="370" width="320" height="40" rx="8" fill="rgba(124,58,237,0.05)"/>
  <circle cx="858" cy="390" r="6" fill="#3b82f6"/>
  <text x="874" y="388" font-family="sans-serif" font-size="12" fill="#e8e0f0">Agent "CodeReviewer" responded</text>
  <text x="874" y="402" font-family="sans-serif" font-size="10" fill="#9a8ab0">15 min ago</text>

  <rect x="840" y="420" width="320" height="40" rx="8" fill="rgba(124,58,237,0.05)"/>
  <circle cx="858" cy="440" r="6" fill="#f59e0b"/>
  <text x="874" y="438" font-family="sans-serif" font-size="12" fill="#e8e0f0">Knowledge base sync completed</text>
  <text x="874" y="452" font-family="sans-serif" font-size="10" fill="#9a8ab0">1 hour ago</text>

  <rect x="840" y="470" width="320" height="40" rx="8" fill="rgba(124,58,237,0.05)"/>
  <circle cx="858" cy="490" r="6" fill="#7c3aed"/>
  <text x="874" y="488" font-family="sans-serif" font-size="12" fill="#e8e0f0">Playground test with GPT-4o</text>
  <text x="874" y="502" font-family="sans-serif" font-size="10" fill="#9a8ab0">2 hours ago</text>

  <!-- Bottom row -->
  <rect x="20" y="590" width="380" height="140" rx="12" fill="rgba(26,18,40,0.6)" stroke="rgba(124,58,237,0.12)" stroke-width="1"/>
  <text x="40" y="620" font-family="sans-serif" font-size="15" fill="#e8e0f0" font-weight="600">Quick Actions</text>
  <rect x="40" y="635" width="170" height="38" rx="8" fill="url(#accent2)" opacity="0.8"/>
  <text x="70" y="658" font-family="sans-serif" font-size="12" fill="#fff">New Conversation</text>
  <rect x="220" y="635" width="160" height="38" rx="8" fill="rgba(124,58,237,0.1)"/>
  <text x="250" y="658" font-family="sans-serif" font-size="12" fill="#a78bfa">Create Workflow</text>
  <rect x="40" y="682" width="170" height="38" rx="8" fill="rgba(124,58,237,0.1)"/>
  <text x="75" y="705" font-family="sans-serif" font-size="12" fill="#a78bfa">Upload Document</text>
  <rect x="220" y="682" width="160" height="38" rx="8" fill="rgba(124,58,237,0.1)"/>
  <text x="255" y="705" font-family="sans-serif" font-size="12" fill="#a78bfa">New Agent</text>

  <rect x="420" y="590" width="380" height="140" rx="12" fill="rgba(26,18,40,0.6)" stroke="rgba(124,58,237,0.12)" stroke-width="1"/>
  <text x="440" y="620" font-family="sans-serif" font-size="15" fill="#e8e0f0" font-weight="600">System Status</text>
  <rect x="440" y="635" width="340" height="24" rx="6" fill="rgba(34,197,94,0.1)"/>
  <circle cx="455" cy="647" r="4" fill="#22c55e"/>
  <text x="466" y="650" font-family="sans-serif" font-size="12" fill="#22c55e">All systems operational</text>
  <text x="466" y="670" font-family="sans-serif" font-size="11" fill="#9a8ab0">• API Latency: 45ms • Uptime: 99.9% • Rate limit: 42%</text>

  <rect x="820" y="590" width="360" height="140" rx="12" fill="rgba(26,18,40,0.6)" stroke="rgba(124,58,237,0.12)" stroke-width="1"/>
  <text x="840" y="620" font-family="sans-serif" font-size="15" fill="#e8e0f0" font-weight="600">Cost Summary</text>
  <text x="840" y="650" font-family="sans-serif" font-size="11" fill="#9a8ab0">Today's AI Spend</text>
  <text x="840" y="680" font-family="sans-serif" font-size="22" fill="#e8e0f0" font-weight="700">$1.24</text>
  <text x="910" y="680" font-family="sans-serif" font-size="11" fill="#22c55e">-8% vs yesterday</text>
  <text x="840" y="700" font-family="sans-serif" font-size="11" fill="#9a8ab0">7-day avg: $1.42/day</text>
</svg>
